name: Status iz tablice prodaje
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency: status
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet openpyxl
      - name: Procitaj tablicu
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python .github/sync_status.py status.json
      - name: Objavi ako se promijenilo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "DTC Resort"
          git config user.email "dtcresort@gmail.com"
          git commit -am "Status prodaje"
          git push
          gh api -X POST repos/${{ github.repository }}/pages/builds || true
